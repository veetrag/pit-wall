apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties, which is
// gitignored — see keystore.properties.example at the repo root.
//
// If the file is absent (fresh clone, CI, or anyone only doing debug work) we
// deliberately do NOT fail configuration: the release build just stays
// unsigned. Failing here would break `assembleDebug` for everyone who has no
// reason to hold the signing key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.veetrag.pitwall"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.veetrag.pitwall"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 2 is live in production at Google (submitted as versionName 1.0 --
        // the 1.1 bump in 35305ac landed AFTER that bundle was built, so 1.1
        // was never released). Play rejects a duplicate versionCode, so this
        // release is 3, and the next must be 4.
        versionCode 3
        // MUST match package.json's version -- pinned by
        // tests/data/appVersion.test.ts, because gradle cannot import JSON and
        // nothing else in the toolchain reads Android config.
        //
        // 1.2, not 2.0: over the live 1.0 this adds race incidents, qualifying,
        // the multi-season career, badges, the career economy and the font fix.
        // That is a substantial content release, not a change to what the game
        // IS -- 2.0 is worth keeping for that.
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn('Pit Wall: android/keystore.properties not found — release build will be UNSIGNED and cannot be uploaded to Play. See keystore.properties.example.')
            }
            // R8 code shrinking + obfuscation. proguard-rules.pro is load-bearing:
            // Capacitor resolves its plugins reflectively, so without those keep
            // rules R8 strips them and the app breaks at RUNTIME with no build
            // error. Read that file before touching this flag.
            minifyEnabled true
            // Drops unreferenced resources. Safe here because nothing looks a
            // resource up by name at runtime -- the splash drawables are named
            // from styles.xml and the launcher icons from the manifest, both of
            // which the shrinker follows.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Must be applied alongside google-services, not instead of it. See
        // the note on the classpath in the root build.gradle.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
