apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties, which is
// gitignored — see keystore.properties.example at the repo root.
//
// If the file is absent (fresh clone, CI, or anyone only doing debug work) we
// deliberately do NOT fail configuration: the release build just stays
// unsigned. Failing here would break `assembleDebug` for everyone who has no
// reason to hold the signing key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.veetrag.pitwall"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.veetrag.pitwall"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 2 is the AAB currently in review at Google; Play rejects a duplicate
        // versionCode, so the next binary release must be 3.
        versionCode 3
        // 1.1, not 1.0.1: the next release carries the whole race-incidents
        // feature (driver errors, crashes, safety cars, and the five UI
        // surfaces), not just the icon and minify fixes. Change if you'd
        // rather ship those separately.
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn('Pit Wall: android/keystore.properties not found — release build will be UNSIGNED and cannot be uploaded to Play. See keystore.properties.example.')
            }
            // R8 code shrinking + obfuscation. proguard-rules.pro is load-bearing:
            // Capacitor resolves its plugins reflectively, so without those keep
            // rules R8 strips them and the app breaks at RUNTIME with no build
            // error. Read that file before touching this flag.
            minifyEnabled true
            // Drops unreferenced resources. Safe here because nothing looks a
            // resource up by name at runtime -- the splash drawables are named
            // from styles.xml and the launcher icons from the manifest, both of
            // which the shrinker follows.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
