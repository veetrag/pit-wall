apply plugin: 'com.android.application'

// Release signing credentials live in android/keystore.properties, which is
// gitignored — see keystore.properties.example at the repo root.
//
// If the file is absent (fresh clone, CI, or anyone only doing debug work) we
// deliberately do NOT fail configuration: the release build just stays
// unsigned. Failing here would break `assembleDebug` for everyone who has no
// reason to hold the signing key.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.veetrag.pitwall"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.veetrag.pitwall"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 3 (1.2) went live in production on 1 Oct 2026. Play rejects a
        // duplicate versionCode: 1.3 is 4, 1.4 is 5, 1.5 is 6, so 1.6 is 7, 1.6.1 is 8, 1.6.2 is 9, 1.7 is 10, 1.8 is 11, so 1.9 is 12.
        versionCode 12
        // MUST match package.json's version -- pinned by
        // tests/data/appVersion.test.ts, because gradle cannot import JSON and
        // nothing else in the toolchain reads Android config.
        //
        // 1.3 over the live 1.2: cloud save via Play Games, achievements,
        // crash reporting and the in-app review prompt.
        // 1.4: the Race Day Bold redesign, team ladder, car setup and the
        // post-race debrief.
        // 1.5: virtual safety car, rival intel, sprint weekends, the debrief
        // lap chart, and the 1.5 phone-pass fixes.
        // 1.6: race texture (weather fixes, slow stops, radio requests, forecast, red flag) and around the race (what-if, share card, stats, scenarios, guided first race, tyre palette, text size, team offers).
        // 1.7: Lantern Quay, Mesa Roja, night circuits, circuit traits.
        // 1.8: challenges hub, historic pack, daily challenge.
        // 1.9: start editor and share codes.
        versionName "1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn('Pit Wall: android/keystore.properties not found — release build will be UNSIGNED and cannot be uploaded to Play. See keystore.properties.example.')
            }
            // R8 code shrinking + obfuscation. proguard-rules.pro is load-bearing:
            // Capacitor resolves its plugins reflectively, so without those keep
            // rules R8 strips them and the app breaks at RUNTIME with no build
            // error. Read that file before touching this flag.
            minifyEnabled true
            // Drops unreferenced resources. Safe here because nothing looks a
            // resource up by name at runtime -- the splash drawables are named
            // from styles.xml and the launcher icons from the manifest, both of
            // which the shrinker follows.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ask AGP to put native symbol tables in the AAB (BUNDLE-METADATA/
            // com.android.tools.build.debugsymbols) for Play's native-code warning.
            // NOTE 2026-10-23: today this produces NOTHING. Our only .so is
            // androidx.datastore's libdatastore_shared_counter.so, which ships
            // pre-stripped, so AGP logs "native debug metadata has already been
            // stripped" and there is no symbol table to extract. The Play warning
            // is advisory and cannot be cleared from our side; this setting starts
            // working automatically if a dependency ever ships an unstripped .so
            // (needs NDK 27.0.12077973 installed in the SDK at that point).
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Must be applied alongside google-services, not instead of it. See
        // the note on the classpath in the root build.gradle.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
